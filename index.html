<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint into the notch/home-bar area; the
         CSS pads content back with env(safe-area-inset-*). No maximum-scale or
         user-scalable=no — pinch zoom must stay available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Collaba.in — Relevant influencer collaborations for growing businesses</title>
    <meta
      name="description"
      content="Reach right-fit audiences through Instagram, YouTube, and Facebook creators they already trust. Collaba.in matches and coordinates influencer collaborations, with your first pilot free."
    />
    <meta name="theme-color" content="#5B45F5" />
    <!-- Declared here as well as in CSS so it applies before the stylesheet loads. -->
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://collaba.in/" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Collaba.in" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Collaba.in" />
    <meta property="og:url" content="https://collaba.in/" />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:title"
      content="Collaba.in — Relevant influencer collaborations for growing businesses"
    />
    <meta
      property="og:description"
      content="Reach right-fit audiences through Instagram, YouTube, and Facebook creators they already trust. Collaba.in matches and coordinates influencer collaborations, with your first pilot free."
    />
    <meta property="og:image" content="https://collaba.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Collaba.in — relevant influencer collaborations for growing businesses"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Collaba.in — Relevant influencer collaborations for growing businesses"
    />
    <meta
      name="twitter:description"
      content="Reach right-fit audiences through Instagram, YouTube, and Facebook creators they already trust. Your first pilot is free."
    />
    <meta name="twitter:image" content="https://collaba.in/og-image.png" />

    <!-- Manrope is self-hosted via @fontsource-variable/manrope (imported in
         src/main.tsx), so there is no render-blocking third-party font request. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Collaba.in",
        "url": "https://collaba.in/",
        "description": "Collaba.in matches growing businesses with right-fit Instagram, YouTube, and Facebook creators and coordinates the collaboration from brief to outcome review.",
        "areaServed": "IN",
        "makesOffer": {
          "@type": "Offer",
          "name": "First influencer collaboration pilot",
          "description": "A first pilot collaboration, scoped and coordinated by Collaba.in."
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
