<!--
  Source for public/og-image.png (1200x630 social card).

  Drawn on a 1200x1200 canvas with the artwork centred in the middle 630px band
  so macOS QuickLook, which always thumbnails to a square, rasterises it without
  distortion. Regenerate with the two commands in design/regen-images.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="285" x2="1200" y2="915" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f7fc"/>
      <stop offset="0.55" stop-color="#f3f1ff"/>
      <stop offset="1" stop-color="#fff3f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <g transform="translate(0 285)">
    <!-- Wordmark: three linked nodes, matching IconNodes in src/components/Icons.tsx -->
    <g transform="translate(96 66)" fill="none" stroke="#5b45f5" stroke-width="3.4" stroke-linecap="round">
      <circle cx="8" cy="20" r="7"/>
      <circle cx="34" cy="6" r="7"/>
      <circle cx="34" cy="34" r="7"/>
      <path d="M14 16.5 27.5 9.5M14 23.5 27.5 30.5"/>
    </g>
    <text x="148" y="100" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8" fill="#171426">Collaba<tspan fill="#e65347">.in</tspan></text>

    <text font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-2.2" fill="#171426">
      <tspan x="96" y="250">Reach the right audience</tspan>
      <tspan x="96" y="330">through creators they</tspan>
      <tspan x="96" y="410" fill="#4935d4">already trust.</tspan>
    </text>

    <g font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">
      <rect x="96" y="474" width="168" height="48" rx="24" fill="#ffffff" stroke="#ddd8e8" stroke-width="1.5"/>
      <text x="180" y="504" text-anchor="middle" fill="#171426">Instagram</text>

      <rect x="280" y="474" width="152" height="48" rx="24" fill="#ffffff" stroke="#ddd8e8" stroke-width="1.5"/>
      <text x="356" y="504" text-anchor="middle" fill="#171426">YouTube</text>

      <rect x="448" y="474" width="158" height="48" rx="24" fill="#ffffff" stroke="#ddd8e8" stroke-width="1.5"/>
      <text x="527" y="504" text-anchor="middle" fill="#171426">Facebook</text>

      <rect x="622" y="474" width="196" height="48" rx="24" fill="#fff3f1" stroke="#ffe2de" stroke-width="1.5"/>
      <text x="720" y="504" text-anchor="middle" fill="#c24135">First pilot free</text>
    </g>
  </g>
</svg>
